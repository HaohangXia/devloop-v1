# 阶段计划模板：把它复制到 `<项目>/.devloop/plans/<阶段>.toml` 再改。
#
# ⚠️ 这份模板的每个字段旁边都写着它的**由来**，不是「做什么」——
#    「做什么」看 devloop/plan.py，那里是权威。这里记「为什么这么设」。
#
# ⛔ **每个数字都必须写清依据**。找不到依据的数就标「拍脑袋的初值」，
#    别装成有根据——本仓库多次踩过「抄来的数字没人敢改」的坑。
#
# ## TOML 字符串纪律（Windows 用户必读）
#
# ⚠️ 基本串（双引号）里反斜杠要转义，Windows 路径必炸：
#
#     path = "C:\pg\eco-ob"        # ✗ Unescaped '\' in a string
#     path = 'C:\pg\eco-ob'        # ✓ 字面串（单引号），逐字节原样
#
# ⛔ 但不是「见双引号就报错」——含义看**值内容**，不看引号种类。
#    普通字符串（如闸名、任务 id）双引号完全合法。


# ---------------------------------------------------------------------------
# [plan]：文件格式版本。
# ---------------------------------------------------------------------------

[plan]
# ⛔ 只认 1。版本号变了意味着字段语义可能变了——工具会拒绝加载而不是
#    悄悄用旧语义读新文件（devloop/plan.py::load）。
version = 1


# ---------------------------------------------------------------------------
# [stage]：这个阶段是什么、在哪里、以什么为基准。
# ---------------------------------------------------------------------------

[stage]
# 阶段标识。命令行用它选阶段：`devloop autopilot --stage <id>`。
# 建议与文件名一致（`plans/<id>.toml`），减少一层间接。
id = 'example'

# 阶段目标。⚠️ 写给**下一个来维护这份计划的人**看，不是给模型看。
# 一句话说清「这一波要拿下什么」，模糊目标会让派单循环没有停止条件。
goal = '示例：说清这个阶段到底要交付什么（这句是模板占位，用之前改掉）'

# 任务书目录，**相对项目根**（不是相对本文件）。
# 计划文件的位置是固定的 `<项目根>/.devloop/plans/<阶段>.toml`，
# 所以 `task_dir = '.devloop/tasks'` 展开后是 `<项目根>/.devloop/tasks/`。
# ⚠️ 加载时会挨个查 `<task_dir>/<任务 id>.md` 是否存在——**在花第一分钱之前**，
#    缺任何一份任务书都会直接 ConfigError 退 2。
task_dir = '.devloop/tasks'

# 基准 git 引用（分支、tag、commit 都行）。派下每一单前用它对齐工作副本。
# ⚠️ 与评测集要同源；基准漂了但计划没改，会出现「昨天绿今天红」的假回归。
base = 'HEAD'

# ⭐ 接力：后一单的工作副本从**前一单已过闸的产出**起（G-59）。默认 false。
# ⛔ 开了之后几单会绑成一串：合并主线时合最后一个就全拿到——
#    但**不能只否掉前一单**（宪法 C-2/C-4：合回主线要人逐单批）。
#    这个代价必须由人明确接受，所以默认关。
# ⛔ 与 `parallel > 1` **互斥**：接力的语义要求串行，两个一起开会让后一单
#    从没跑完的起点复制，那不是性能问题、是正确性问题。加载时会直接拒。
chain = false

# ⭐ 一波同时派几单（G-66）。默认 1（串行）。
# ⚠️ 收益是摊薄闸的墙钟——eco-ob 实测闸占整单 **87%**，串行时墙钟浪费在等闸上。
# ⛔ 代价全落在**人**身上：N 个分支要按宪法 C-2/C-4 逐个批准，范围重叠还要人解冲突。
#    加载时会按 tools 分组跑 fanout.check(...)，判据全文：`devloop dispatch --why-parallel`。
parallel = 1


# ---------------------------------------------------------------------------
# [stage.budget]：无人值守时挡在「一夜烧光」前面的**唯一**防线。
# ---------------------------------------------------------------------------
#
# ⛔ 四个必填上限（total_usd / reserve_usd / max_dispatches / max_wall_min）
#    一个都不能省——省任何一个都等于把那条防线拆掉。
# ⭐ 其中 max_dispatches 是**兜底**：成本 API 挂了、算不出美元时，
#    它是最后一个还能停住循环的数（参考 demo.toml 的注释）。

[stage.budget]

# 阶段总预算（美元）。派下一单之前会检查 `已花 + 保留 ≤ 总额`。
# 依据：拍脑袋的初值——真实标定需要「写路径 + 闸」的样本足量，
#      新项目上没有历史数据时先给一个「烧光了也不心疼」的小数。
# ⚠️ 上生产前必须用真实运行数据回调，别把演练值带到生产。
total_usd = 0.20

# 单单储备（美元）：派下一单前必须还剩这么多，否则不派。
# 依据：应当取**单单成本的高分位**（p90/p95），不是平均——
#      按平均留，遇到一单贵的就会冲过头。
# ⚠️ 拍脑袋的初值；有 10 条以上单单实际成本后再回调。
reserve_usd = 0.06

# ⭐ 兜底上限：本阶段最多派多少单。**不依赖任何成本计算**，
#    这是成本 API 挂了、单价异常、乘除算错时**唯一还能停住**的数。
# 依据：应当略高于「计划里的任务数 × 平均重试次数」。任务数看下面的 [[task]]。
#      示例值 6 = 假设 3 单任务 × 每单最多重试 1 次再加余量。改的时候要一起改。
max_dispatches = 6

# 阶段墙钟上限（分钟）。到点强停，无论进度。
# 依据：拍脑袋的初值——本仓库实测**闸占整单墙钟 87%**（eco-ob 数据），
#      所以「30 分钟」大约够 3~5 单串行跑完带闸。并行会显著缩短。
# ⚠️ 拆分依据是「你愿意让它无人值守多久」，不是「任务应该跑多久」。
max_wall_min = 30

# 单单默认最大轮数（模型往返次数）。任务级 `max_turns` 为 0 时用它。
# 依据：没用掉的轮数不花钱（G-46），所以**给高不给低**——
#      调低是省不到钱的，只会让本来能过的单在半路被砍。
default_max_turns = 120

# 看门狗窗口 K：连续 K 单没进展就停阶段。
# 依据：保守的可解释初值 3 = 够一次完整的「失败 → 重试 → 换法」循环，
#      再连不动就应该让人介入。
watchdog_k = 3


# ---------------------------------------------------------------------------
# [stage.accept]：阶段级验收。
# ---------------------------------------------------------------------------

[stage.accept]
# ⛔ 点名的闸必须**全部 PASS 才算过**——SKIP 与 VOID 都**不算通过**。
#    - SKIP：闸自己声明「本项目不适用」，被点名的检查根本没执行，无从放行（G-53）。
#    - VOID：闸执行了但结果被弃权/无法定论，同样不能视作绿。
#    两者在 `devloop/gates.py::GateLine` 里各有解释，误把它们当过是最常见的假绿。
#
# ⚠️ 阶段级点名只对 tools = 'implement' 的单生效（会与任务级点名合并）。
#    只读单永远不会跑闸——所以阶段级点名并到只读单上会造出空守卫，
#    加载时会由 `effective_require_pass` 自动跳过（devloop/plan.py::effective_require_pass）。
require_pass = ['语法', 'pytest']


# ---------------------------------------------------------------------------
# [[task]]：单个任务条目。可以有多个。
# ---------------------------------------------------------------------------
#
# ⚠️ 顶层是 `[[task]]`，不是 `[[stage.task]]`——代码用的是 `data["task"]`。
# 每条任务必须在 `<task_dir>/<id>.md` 有对应的任务书，否则加载即拒。


# --- 例 1：只读单（tools = 'readonly'）------------------------------------

[[task]]
# 任务 id。会拼成任务书路径 `<task_dir>/<id>.md`。
# ⛔ 阶段内不许重复；`needs` 不许指向不存在的 id。
id = 'inventory'

# tools = 'readonly'：不建 worktree、不改文件、不跑闸。
# ⚠️ 只读单成本约为写单的 1/35（历史数据），适合做「先看看再决定」的分析步。
tools = 'readonly'

# 依赖：这一单会等这些单都**绿了**才被派（失败的单不解锁下游）。
# ⚠️ 依赖是**图关系**，不是执行顺序偏好：想「先做 A 再做 B」但两者独立，
#    就不要写 needs——让并行的时候能并起来。
needs = []

# 重试次数。整个阶段的 `max_dispatches` 会算上重试。
retries = 1

# 单单轮数上限。0 = 用 [stage.budget].default_max_turns。
# 只读单往往几轮就够，可以显式压低省时间。
max_turns = 0

  [task.accept]
  # ⛔ 只读单不跑闸，所以**必须**用 `why` 显式认领「这单没有机器判据」。
  #    不强制这一条，「忘了写验收标准」和「这单确实没法机检」在文件里
  #    长得一模一样——前者是漏洞，后者是已知代价（devloop/plan.py::load）。
  # ⚠️ 只读单**不许**填 require_pass——填了会被加载器直接拒绝。
  why = '只读盘点：产出是一份自然语言报告，没有可机检的结构，价值靠人读。'


# --- 例 2：写单（tools = 'implement'）------------------------------------

[[task]]
id    = 'implement-feature-x'
# tools = 'implement'：建 worktree、允许改文件、跑闸、结果参与验收。
tools = 'implement'
needs = ['inventory']
retries = 1
max_turns = 0

  [task.accept]
  # ⛔ 点名的闸必须**全部 PASS**——SKIP / VOID 都不算过（同 [stage.accept]）。
  # ⚠️ 与阶段级 require_pass 会自动**合并去重**，不必抄一遍。
  #    这里写的是「除阶段基础闸外，这一单还额外要求的」。
  require_pass = ['语法', 'pytest']

  # 有 require_pass 时 `why` 可选；没有 require_pass 时**必须**写 why。
  # ⚠️ 写在这里就是记给「以后想改闸列表的人」的备注——
  #    「为什么只点这几道、没点那道」的理由比闸名本身更值钱。
