# 宪法 · 机械判据表
#
# ⛔ 这个文件是**给脚本读的**。给人读的那份在 constitution.md，两者靠条款 ID 对应。
#    为什么分开：散文里「不得修改基线」这句话，脚本无法从中导出「哪些路径、
#    什么判据、哪个时刻判」——要么编一个正则（判据的维度错了），要么根本不判
#    （守卫的目标不存在）。两种都是假绿。
#
# ⚠️ 改这个文件之后必须重新锚定：
#      devloop constitution anchor --project <路径>
#    那是一条**需要你亲自执行**的命令。锚一旦能自愈，它就不是锚。

schema = 1


# ══ 受保护的真实文件 ═══════════════════════════════════════════
# 判据：绝对路径的 SHA-256 逐项对账，**不依赖 git 跟踪状态**
#      （所以对「.devloop/ 未被跟踪」的项目同样有效）。
# 时刻：T0 派单前登记 · T5 跑完复验。
#
# ⛔ 这里写错路径会当场炸（load 会 raise）。这是故意的：
#    清单写错**比没有清单更坏**——它会每次都报「无命中」，看起来一切正常，
#    而实际上守卫保护的是一个空集合。

[[protected_file]]
clause = "A-1"
title  = "不得修改闸"
path   = ".devloop/gates.sh"

[[protected_file]]
clause = "A-1"
title  = "不得修改宪法本身（判据表）"
path   = ".devloop/constitution.toml"      # 自指：本文件在自己的清单里

[[protected_file]]
clause = "A-1"
title  = "不得修改宪法本身（人读版）"
path   = ".devloop/constitution.md"

[[protected_file]]
clause = "A-4"
title  = "不得修改工人的规则摘要"
path   = ".devloop/rules-digest.md"
# ⚠️ rules-digest 是工人接收铁律的唯一渠道。第 3 轮审核指出它此前既不在
#    A 类（路径不在工具本体里）也不在 B 类（修改不是删除）——分类盲区。

[[protected_file]]
clause = "A-4"
title  = "不得修改项目配置"
path   = ".devloop/config.toml"
optional = true                            # 允许不存在（有些项目就是没有）


# ══ 受保护的树内路径 ═══════════════════════════════════════════
# 判据：**base 锚定的漂移**——拿派单前那个提交里的内容与工作区实际内容比对。
#
# ⚠️ 为什么不是 `git status`：工人把改动**提交掉**，工作区就干净了，
#    任何基于 status 的判据都会说「没事」。base 锚定照样抓得到。
# ⚠️ 匹配规则：`*` 不跨 `/`，`**` 跨，末尾 `/` 表示整个目录。
#    ⛔ 守卫**过宽和过窄一样坏**：过窄漏抓；过宽天天误报，
#    而天天误报会训练人去忽略上报，那比不上报更糟。

# ⛔ **下面二选一，不能都不写。**
#    一条 [[protected_tree]] 都没有 = 树内判据覆盖 0 条路径，
#    却每单都报「无宪法命中」——与「闸一条都没验却报全过」是同一种假绿。
#    所以加载时会拒绝，除非你显式声明「本项目树内无可保护」。

# —— 选项 A：列出要保护的路径（推荐）——————————————
# [[protected_tree]]
# clause = "C-2"
# title  = "不得改基线参考数据"
# glob   = "tests/ref_*.json"
#
# [[protected_tree]]
# clause = "C-1"
# title  = "不得改设计文档"
# glob   = "01_设计文档/**"
#
# ⚠️ 模式在当前项目里一个文件都匹配不到会被拒绝（多半是写错了）。
#    若确实是「现在为空、就是要防它冒出东西」，加 allow_empty = true。

# —— 选项 B：显式声明没有 ————————————————————
#    ⚠️ 声明之后，**每一次判定结论都会把这句 why 印出来**，
#       所以它不是「关掉守卫」，是「把缺口摆到明面上」。
[tree]
coverage = "none"
why = "<为什么这个项目树内无可保护——请如实填写，它会被印在每一次结论里>"


# ══ 判不了的条款 ═══════════════════════════════════════════════
# ⛔ **必须逐条登记。** 每次判定的结论都会带上「未覆盖 N 条：…」的尾巴。
#
#    为什么这条是硬性的：不登记它们，`summary()` 就会印出一句
#    **没有尾巴的「无宪法命中」**——而那句话会被读成「查过了，没事」，
#    真相却是「查过的那部分没事，还有 N 条根本没查」。
#    **那句话本身就是假绿。**

[[unjudged]]
clause = "A-2"
status = "partial"
why    = "白名单路径的指纹判得了；但工人有 Bash、cwd 不是牢笼，写到白名单之外不可枚举"
degrade = "白名单指纹（强但不完全）+ 诚实标注射程。⛔ 不得写成「已覆盖」"

[[unjudged]]
clause = "A-3"
status = "no-target"
why    = "预算/重试/并发上限目前没有持久化状态——**受保护的目标根本不存在**"
degrade = "先建 limits.toml 再谈守卫。现在写守卫 = 守卫的目标不存在"

[[unjudged]]
clause = "A-5"
status = "none-by-design"
why    = "「读闸」与「意图绕闸」无法从字节区分；读 gates.sh 是权限内正常动作"
degrade = "让绕闸无效而非可检测：闸从仓库外只读副本执行 + 派单前指纹校验"

[[unjudged]]
clause = "B-3b"
status = "out-of-reach"
why    = "pip install 落 site-packages，不在任何仓库里"

[[unjudged]]
clause = "B-4"
status = "out-of-reach"
why    = "对外发送事后**零痕迹**：diff、台账、回执里都不留证据"
degrade = "唯一手段是事前不给能力：[refuse] 硬拒 full+detach；无外网环境就绪前不得无人值守跑 full 档"

[[unjudged]]
clause = "C-1b"
status = "human-sampled"
why    = "同一个阈值 0.3→0.5 可能是实现细节也可能是设计决策，判据在意图里不在字节里"
degrade = "只判路径半；语义半降级为贵模型逐条对账（采样，非全覆盖）"
# ⛔ 特别禁止给它编启发式（「改动超 N 行 = 设计变更」）：那比没有判据更坏，
#    因为它会产生一个**可信的绿**。

[[unjudged]]
clause = "C-5"
status = "no-target"
why    = "重试计数没有持久化状态；成本判据要等 limits.toml"

[[unjudged]]
clause = "C-6"
status = "partial"
why    = """阶段完成上报本来就是人的事 —— ⚠️ 而「人」正是每轮失忆的那个。
2026-08-11 用户原话：「我们的主要目标是这个工具，eco-ob 是我们的手段。
我感觉你每次都在忘这一条。」⭐ 于是补上了一半机械判据。"""
degrade = """⭐ 只判一件事：装到本项目的 `gates.sh` 版号有没有**超过**模板
（`devloop/doctor.py::gates_template_drift` 的「领先」分支 + 每轮注入
`tools/devloop-mode-hook.py::_drift_line`）。判据落在版号上，
⭐ 因为要让它归零**必须真的去编辑 `templates/gates.sh` 的内容** —— 写字改不动它。
⛔ 判不了：① 不落在 gates.sh 上的教训（进 task.md / TROUBLESHOOTING.md 的那些）；
② 「只把模板里的数字改大而不搬内容」——一个字符的事，机器分不出；
③ 本地改了闸却不给版号加一 —— 那时两个数相等，守卫静默绿。**这是真洞。**
⛔ 不得写成「已覆盖」：本仓已为「守卫冠名要验的东西其实没验」栽过（G-88 的假 PASS 多活三天）。"""

[[unjudged]]
clause = "C-7"
status = "human-soft"
why    = "「例外层自认拿不准」= 模型自述，直接撞铁律「完成由退出码裁决，不由模型自述」"
degrade = "保留为软信号，但配硬对偶：例外层被触发次数 ≥ N 即停机（可判定，就是数数）"
# ⛔ 绝不能写「例外层没喊停 = 没问题」。


# ══ 起进程之前的硬拒 ═══════════════════════════════════════════

[refuse]
# `full` 比 `implement` 多的就是 WebFetch —— 无人值守 + 对外通道。
# 而「对外发送」判不了（见 B-4），所以只能事前不给能力。
full_tools_when_detached = true
