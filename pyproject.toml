[project]
name = "devloop"
version = "0.1.0"
description = "AI coding-agent orchestration with separate worktrees, executable gates and run telemetry"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
devloop = "devloop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
