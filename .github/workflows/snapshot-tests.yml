name: Snapshot tests (no live models)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Configure Git for throwaway test repositories
        run: |
          git config --global init.defaultBranch master
          git config --global user.name "Snapshot test"
          git config --global user.email "snapshot-test@example.invalid"
      - name: Run snapshot suite without model credentials
        run: python -m pytest -ra
