# 阶段：验 2026-08-03 那一整天的宪法层改动**在真跑里**是什么样
#
# ⛔ 为什么必须真跑：08-03 改了 13 个提交、715 条测试，
#    ⚠️ **一次真派单都没有**（台账最后一单停在 08-02 18:54）。
#    按本项目自己的口径，这不叫「能用」。
#
# ⭐ 这一轮**不是**为了做这两件活——活是真的、也该做，但它们是**载体**。
#    真正要看的是三件事，⚠️ 每一件都只有真跑才看得到：
#
#    1. 新加的 `.devloop/**` 与 `tests/**` 树内守卫，会不会在**正常干活**时误报？
#       ⭐ 两单都要求**新建**测试文件——那正好压在 `allow_added`（改已有=命中、
#       新建=放行）这条分级语义上。⛔ 它要是判错，第一单就红。
#    2. `.devloop/dossier/` 那个漏进 .gitignore 的洞（G-104）真的堵上了吗？
#       ⚠️ 判据是**第二单**：卷宗是第一单结束时写的，
#       若忽略名单没生效，第二单会因「活工作区变了」误报越线。
#       ⭐ 所以这一阶段**必须两单**，一单验不出来。
#    3. 硬拒（`refuse_preflight`）今天才接进自动驾驶——两单都是 `implement`，
#       ⛔ 该放行；若它误拒，整个阶段开都开不了。
#
# ⚠️ 两单**互不依赖、不同文件**，所以任何一单失败都不会连累另一单。

[plan]
version = 1

[stage]
id       = 'verify-0803'
goal     = '验 08-03 那轮宪法层改动在真跑里生效：树内守卫不误报 · 卷宗不污染工作区 · 硬拒不误拒'
task_dir = '.devloop/tasks'
base     = 'HEAD'

# ⛔ 串行。⚠️ 并行在这里是**有害的**：本阶段第 2 条要验的正是
#    「第一单写下卷宗之后，第二单会不会误报」——⭐ 并行会让两单同时开始，
#    第二单在卷宗写出来**之前**就采完快照，那条判据就白设了。
parallel = 1

[stage.budget]
# ⚠️ 走订阅后端，美元成本恒为 0——`total_usd` 在默认后端上**不起作用**
#    （`pricing.py` 有说明）。真正管用的是下面三条 + 撞额度即停。
total_usd      = 0.50
reserve_usd    = 0.10

# ⭐ 2 单 × 最多 2 次 = 4。⛔ 不给 6：今天刚改完守卫，
#    ⚠️ 要是它误报，多给的次数只是拿额度去撞同一堵墙——
#    那正是「闸自身故障时重试没有意义」这条判断要说的事。
max_dispatches = 4

# ⚠️ 本仓单元实测 2–5 分钟（闸里 pytest 约 40 秒，今天涨到 715 条会更久）。
#    给 30 分钟有余量；⛔ 墙钟是唯一不依赖成本计算的刹车。
max_wall_min   = 30

# ⚠️ 只有 2 单，K 给 2 = 「两轮没新绿就停」。
watchdog_k     = 2

default_max_turns = 120

[stage.accept]
# ⛔ 阶段级点名：每单都要过这三道。⚠️ 任务级再各写自己的，取并集。
#  ⭐ 「测试守卫」是**本轮的重点**——它和今天新加的 `tests/**` 树内判据
#     判的是同一件事（改已有=不行、新建=可以），两者**必须给出一致的结论**。
#     ⚠️ 若闸绿而宪法红（或反过来），那本身就是今天最该知道的发现。
require_pass = ['语法', '测试守卫', 'pytest']

[[task]]
id      = 'n1-git-probe-failure'
tools   = 'implement'
retries = 2
  [task.accept]
  #  ⚠️ 再点一道「被测代码来源」：确认闸跑的是 worktree 里那份代码，
  #     ⛔ 不是主线那份——否则工人改了什么闸都看不见。
  require_pass = ['被测代码来源']

[[task]]
id      = 'n2-nightly-truncation'
tools   = 'implement'
retries = 2
  [task.accept]
  require_pass = ['被测代码来源']
