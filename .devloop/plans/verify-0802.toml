# 阶段：验 2026-08-02 那一轮修复**在真跑里生效**
#
# ⛔ 为什么必须真跑：这一轮改的东西大半只在自动驾驶路径上才走得到，
#    而它们全部只有单测与零额度 E2E 台架的证据，**一次真跑都没有**。
#
# ⚠️ 本阶段**不重复验**已经有零额度证据的东西：
#    · 波次收窄（`plan_wave`）—— `tests/test_autopilot_dispatch_count_e2e.py`
#      已用桩跑过 9 组配置，上下界都断言了。⛔ 拿真钱再验一遍是浪费。
#    · 磁盘估算、prune 归档、VOID 判决 —— 都在闸层/纯函数层验通了。
#
# ⭐ 只验**没有真跑就验不到**的那三条：
#    1. `gate_code` 真的落进台账（要走 `_run_unit` → `telemetry.record`）
#    2. 交接单的失败模式归类**读结构化字段**（换序后是死代码复活的第一遍）
#    3. `_add_err` 的失败原因累积在真链路上成立
#
# ⚠️ 两单**故意设计成一成一败**：
#    v1 该过（验 gate_code=0 那条路），v2 该以「闸自身故障」失败（验归类）。
#    ⛔ v2 失败是**预期结果**，不是这一轮跑砸了。

[plan]
version = 1

[stage]
id       = 'verify-0802'
goal     = '验 08-02 那轮修复在真跑里生效：gate_code 落账 · 归类读结构化字段 · 失败原因累积'
task_dir = '.devloop/tasks'
base     = 'HEAD'

# ⛔ 串行。⚠️ 并行的价值（省闸的墙钟）在本仓不成立——pytest 才 40 秒，
#    而并行的代价是两支分支要人分别批。本阶段只有 2 单，串行更省事。
parallel = 1

[stage.budget]
# ⚠️ 走订阅后端，美元成本恒为 0——`total_usd` 这个数在默认后端上**不起作用**
#    （`pricing.py` 有说明）。真正管用的是下面三条 + 撞额度即停。
total_usd      = 0.50
reserve_usd    = 0.10

# ⭐ 兜底：v1 最多 2 次 + v2 最多 1 次 = 3。⛔ 给 3 不给 6——
#    v2 是**注定失败**的演练单，多给重试次数只是多烧额度撞同一堵墙。
max_dispatches = 3

# ⚠️ 本仓单元实测 2–5 分钟（闸里 pytest 约 40 秒）。给 25 分钟有余量，
#    ⛔ 但不给 60——无人值守时墙钟是另一条不依赖成本的刹车。
max_wall_min   = 25

# ⚠️ 只有 2 单，K 给 2 等于「两轮没新绿就停」。
watchdog_k     = 2

default_max_turns = 80

[stage.accept]
# ⚠️ 阶段级点名：每单都要过这两道。⛔ 任务级还会再并上自己点的。
require_pass = ['语法', 'pytest']


[[task]]
id      = 'v1-ledger-fields'
tools   = 'implement'
retries = 2
  [task.accept]
  #  ⭐ 点名「测试守卫」：本单要求新建测试文件，那道闸会检查
  #     「已有测试一个字没改、新增的都是 test_*.py」。
  require_pass = ['测试守卫', 'pytest']


[[task]]
id      = 'v2-gate-broken-drill'
tools   = 'implement'
#  ⛔ 只给 1 次。它**注定失败**（点名了一道不存在的闸），
#     重试只是拿同样的钱撞同一堵墙——而那正是「闸自身故障 → 先修环境，
#     重试没有意义」这句话要说的事。⭐ 让配置本身体现这条判断。
retries = 1
needs   = ['v1-ledger-fields']
  [task.accept]
  #  ⛔ **这道闸不存在，是故意的。**
  #     `.devloop/gates.sh` 只会输出：语法 / 测试守卫 / 禁改清单 /
  #     被测代码来源 / pytest。没有「基线守卫」这一道。
  #  ⭐ 于是 `run_gates` 走 `missing` 分支 → 退出码 2 → 台账 gate_code=2
  #     → 交接单归类「⚠️ 闸自身故障」→ 建议「先修环境再谈验收」。
  #     那条链在 2026-08-02 换序之前是**死代码**，本单跑它第一遍。
  require_pass = ['基线守卫']
